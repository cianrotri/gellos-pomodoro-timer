<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
     
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="stylesheet.css">
    <title>Gello's Pomodoro Timer</title>
</head>

<body>
    <div class="background"> 
        <h3 class="header">Gello's Pomodoro Timer</h3>

        <div class="mode-container">
            <button class="custom-mode-btn">Custom</button>
            <button class="pomodoro-mode-btn">Pomodoro</button>
        </div>

        <div class="container">
            <div class="timer-text">
                <span id="hours">00</span>:<span id="minutes">00</span>:<span id="seconds">00</span>
            </div>

            <div class="button-container">
                <button class="start-btn">Start</button>
                <button class="pause-btn">Pause</button>
                <button class="break-btn">Break</button>
                <button class="reset-btn">Reset</button>
            </div>
        </div>

        <div class="to-do-list-container">
            <h4 class="to-do-header">To-Do List</h4>
            <ol id="task-list" class="task-list">
                <!-- Tasks will be added here -->               
            </ol>
            <input type="text" id="task-input" class="task-input" placeholder="Add a new task (max 8)">
            <button id="add-task-btn" class="add-task-btn"> Enter </button>
            <p id="task-warning" class="task-warning"> You have hit the task limit ! </p>
            <audio id="alarm-sound" src="audio/adventure_harp.wav" preload="auto"></audio>
        </div>
    </div>

<script src="script.js"> </script>
